<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM-Mundo 2026 — Veikkauskisa</title>
<meta name="theme-color" content="#0d1421">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1421;
    --panel: #16202f;
    --panel2: #1d2a3d;
    --border: #2a3b52;
    --text: #e8eef6;
    --muted: #8fa3bb;
    --accent: #3ddc84;
    --gold: #ffd54a;
    --live: #ff5470;
    --blue: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 12px 12px 60px; }
  header { text-align: center; padding: 14px 0 6px; }
  header .logo { width: 116px; height: auto; filter: drop-shadow(0 8px 20px rgba(0,0,0,.55)); margin-bottom: 2px; cursor: pointer; transition: transform .15s; }
  header .logo:hover { transform: scale(1.04); }
  header h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  .prizes { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .updated { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .updated .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; }
  .updated.err .dot { background: var(--live); }

  nav { display: flex; gap: 6px; margin: 16px 0 14px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 10; }
  nav button {
    flex: 1; min-width: 0; padding: 10px 4px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  @media (max-width: 480px) { nav { gap: 4px; } nav button { font-size: 13px; padding: 9px 2px; } }
  @media (max-width: 360px) { nav button { font-size: 12px; padding: 9px 1px; } }
  nav button.active { background: var(--accent); color: #08311c; border-color: var(--accent); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }

  /* leaderboard */
  table.board { width: 100%; border-collapse: collapse; }
  table.board th, table.board td { padding: 9px 10px; text-align: right; }
  table.board th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  table.board td.name, table.board th.name { text-align: left; font-weight: 600; }
  table.board td.rank, table.board th.rank { text-align: left; width: 36px; color: var(--muted); }
  table.board tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  table.board td.total { font-weight: 700; color: var(--gold); font-size: 16px; }
  .livepts { color: var(--live); font-weight: 700; font-size: 12px; margin-left: 4px; }
  .medal { margin-right: 4px; }

  /* matches */
  .day { padding: 8px 12px; background: var(--panel2); font-weight: 700; font-size: 13px; color: var(--blue); text-transform: capitalize; border-bottom: 1px solid var(--border); }
  .match { border-bottom: 1px solid var(--border); cursor: pointer; }
  .match:last-child { border-bottom: none; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .mtime { width: 44px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .mgroup { width: 20px; color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .mteams { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }
  .mscore { font-weight: 800; font-size: 16px; min-width: 44px; text-align: center; }
  .mscore.pre { color: var(--muted); font-weight: 400; font-size: 12px; }
  .mstatus { min-width: 40px; text-align: right; font-size: 11px; color: var(--muted); }
  .badge-live { color: var(--live); font-weight: 800; }
  .livedot { display: inline-block; animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .picks { display: none; padding: 4px 12px 12px; }
  .match.open .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; }
  .pick { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 7px; background: var(--panel2); font-size: 13px; }
  .pick .pp { font-weight: 700; margin-left: 9px; }
  .pick.p5 { background: #4d3f10; color: var(--gold); }
  .pick.p4 { background: #44390f; color: var(--gold); }
  .pick.p2 { background: #14402a; color: var(--accent); }
  .pick.p0 { color: var(--muted); }
  .pick.live { outline: 1px dashed var(--live); }
  .hint { color: var(--muted); font-size: 11px; padding: 0 12px 10px; }
  .scorers { font-size: 12px; color: var(--muted); padding: 2px 2px 6px; }
  .picks .scorers { grid-column: 1 / -1; border-bottom: 1px solid var(--border); margin-bottom: 3px; }
  .scorers .gline { padding: 1px 0; }
  .pen { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .mscore .pen { display: block; font-weight: 400; margin-top: 1px; }
  .koexp { color: var(--muted); opacity: .4; font-size: 13px; margin-left: 4px; display: inline-block; transition: transform .15s, opacity .15s; }
  .match.ko.open .koexp { transform: rotate(90deg); opacity: .7; }
  .match.ko.clickable .mrow:hover .koexp { opacity: .7; }
  .solabel { color: var(--gold); font-weight: 600; margin: 3px 0; }
  .pmiss { color: var(--live); }
  .bpen { font-size: 9px; color: var(--muted); margin-left: 1px; }
  .filterbar { display: flex; gap: 6px; margin: 0 0 12px; }
  .fpill { flex: 1; min-width: 0; padding: 7px 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
  .fpill:hover { color: var(--text); }
  .fpill.on { background: var(--panel2); color: var(--text); border-color: var(--blue); }
  .fpill .fcount { font-size: 11px; opacity: .65; font-weight: 700; }

  /* specials */
  h3.sec { margin: 18px 4px 8px; font-size: 15px; }
  .panel-scroll { overflow-x: auto; }
  .spec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .spec-table th, .spec-table td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  .spec-table th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .spec-table td.pts { text-align: right; font-weight: 700; color: var(--gold); white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 20px; background: var(--panel2); margin: 1px 2px 1px 0; font-size: 12px; }
  .chip.hit { background: #14402a; color: var(--accent); font-weight: 600; }
  .chip.hit.bonus { background: #4d3f10; color: var(--gold); }
  .chip.miss { color: var(--muted); text-decoration: line-through; opacity: 0.7; }
  .chip.dead { color: var(--muted); text-decoration: line-through; opacity: 0.6; }
  .outtag { color: var(--live); font-size: 10px; font-weight: 700; text-decoration: none; margin-left: 2px; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 4px 14px; }
  .scorerlist { font-size: 13px; color: var(--muted); margin: 4px; }
  .ko .mrow { cursor: default; }
  .match.ko.clickable .mrow { cursor: pointer; }
  .ko .day { text-transform: none; }
  .ko .mtime { width: 56px; white-space: normal; line-height: 1.25; flex-shrink: 0; }
  .ko-tbd { color: var(--muted); font-weight: 500; font-style: italic; }
  .ko-poss { font-weight: 600; }
  .ko-poss .koslash { color: var(--muted); font-weight: 400; margin: 0 1px; }
  .koexp { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .kopicks { display: none; padding: 2px 12px 12px; }
  .match.ko.open .kopicks { display: block; }
  .kohint { color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
  .kosides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 560px) { .kosides { grid-template-columns: 1fr; } }
  .koside { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .kosh { font-weight: 700; font-size: 13px; margin-bottom: 5px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .kob { font-size: 13px; padding: 2px 0; }
  .kob .kobets { color: var(--accent); font-size: 11px; }
  .kob-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 2px 0; }
  .roundname { padding: 8px 12px; background: var(--panel2); font-weight: 700; font-size: 13px; color: var(--gold); border-bottom: 1px solid var(--border); }

  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 26px; }

  /* ===== flourish ===== */
  body {
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1100px 480px at 50% -160px, #182c47 0%, var(--bg) 62%) fixed;
  }
  .mscore, table.board td, table.mini td { font-variant-numeric: tabular-nums; }
  header h1 {
    font-size: 32px; font-weight: 800;
    background: linear-gradient(135deg, #ffe27a 15%, #ffb52e 50%, #ffd54a 85%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  nav button { border-radius: 999px; transition: color .15s, border-color .15s, box-shadow .15s; }
  nav button:hover { color: var(--text); border-color: var(--accent); }
  nav button.active { background: linear-gradient(135deg, #46e890, #27b56e); box-shadow: 0 2px 16px rgba(61,220,132,.35); }
  .panel { box-shadow: 0 4px 18px rgba(0,0,0,.28); }
  table.board tr.top1 td { background: linear-gradient(90deg, rgba(255,213,74,.17), rgba(255,213,74,.03)); }
  table.board tr.top2 td { background: linear-gradient(90deg, rgba(202,212,228,.13), rgba(202,212,228,.03)); }
  table.board tr.top3 td { background: linear-gradient(90deg, rgba(205,127,50,.16), rgba(205,127,50,.03)); }
  .day { border-left: 3px solid var(--blue); }
  .mrow { transition: background .12s; }
  .match .mrow:hover { background: rgba(255,255,255,.035); }
  .match.islive { border-left: 3px solid var(--live); }
  .match.islive .mscore { color: var(--live); }
  .flag { margin-right: 4px; }
  .tv {
    font-size: 10px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 0 5px; margin-left: 7px; vertical-align: 1px; white-space: nowrap;
  }
  .streak { font-size: 11px; font-weight: 700; margin-left: 5px; white-space: nowrap; }
  .streak.hot { color: #ff9d2e; }
  .streak.cold { color: #7fc8ff; }

  /* clickable rows -> player modal */
  table.board tbody tr, table.board tr.clk { cursor: pointer; }
  table.board tr.clk:hover td { background: rgba(90,169,255,.10); }
  table.mini tr.clk { cursor: pointer; }
  table.mini tr.clk:hover td { background: rgba(90,169,255,.10); }
  .namecell { display: inline-flex; align-items: center; gap: 2px; }
  .namecell .chev { color: var(--muted); font-size: 11px; opacity: .55; margin-left: 4px; }

  /* player modal */
  .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(4,8,14,.66); padding: 18px 10px; overflow-y: auto; backdrop-filter: blur(2px); }
  .modal-card { max-width: 680px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,.55); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel2); border-radius: 14px 14px 0 0; z-index: 1; }
  .modal-head h2 { margin: 0; font-size: 20px; }
  .modal-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .modal-close { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 9px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; flex-shrink: 0; line-height: 1; }
  .modal-close:hover { border-color: var(--live); color: var(--live); }
  .modal-body { padding: 6px 14px 18px; }
  h3.psec { font-size: 14px; margin: 16px 2px 6px; color: var(--gold); }
  .pstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 10px; }
  .pstat { background: var(--panel2); border-radius: 9px; padding: 9px 6px; text-align: center; }
  .pstat-n { font-size: 18px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .pstat-l { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .3px; }
  @media (max-width: 460px) { .pstats { grid-template-columns: repeat(2, 1fr); } }
  table.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ptable td { padding: 6px 5px; border-bottom: 1px solid rgba(42,59,82,.4); }
  tr.pt-day td { background: var(--panel2); color: var(--blue); font-weight: 700; font-size: 12px; text-transform: capitalize; }
  tr.pt-hdr td { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; padding-bottom: 2px; border-bottom: none; }
  .pt-time { color: var(--muted); width: 40px; white-space: nowrap; }
  .pt-pick { text-align: center; white-space: nowrap; color: var(--muted); width: 50px; }
  .pt-res { text-align: center; white-space: nowrap; width: 50px; font-weight: 700; }
  .pt-res.pre { color: var(--muted); font-weight: 400; }
  .pt-pts { text-align: right; white-space: nowrap; width: 34px; font-weight: 700; color: var(--muted); }
  tr.prow.r5 .pt-pts, tr.prow.r4 .pt-pts { color: var(--gold); }
  tr.prow.r2 .pt-pts { color: var(--accent); }
  tr.prow.r5, tr.prow.r4 { background: rgba(255,213,74,.06); }
  tr.prow.r2 { background: rgba(61,220,132,.05); }
  tr.prow.live .pt-res { color: var(--live); }
  .pspec { display: flex; gap: 10px; padding: 6px 2px; border-bottom: 1px solid rgba(42,59,82,.4); }
  .pspec-l { color: var(--muted); font-size: 12px; flex: 0 0 92px; padding-top: 3px; }
  .pspec-v { flex: 1; }

  /* group standings */
  table.gtable { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  table.gtable td { padding: 7px 4px; border-bottom: 1px solid rgba(42,59,82,.4); text-align: center; }
  table.gtable tr:last-child td { border-bottom: none; }
  table.gtable td:nth-child(1) { width: 6%; }
  table.gtable td:nth-child(2) { width: 38%; }
  table.gtable td:nth-child(3), table.gtable td:nth-child(4),
  table.gtable td:nth-child(5), table.gtable td:nth-child(6) { width: 8%; }
  table.gtable td:nth-child(7) { width: 15%; }
  table.gtable td:nth-child(8) { width: 9%; }
  table.gtable td.gteam { text-align: left; font-weight: 600; }
  table.gtable td.gpos { color: var(--muted); }
  table.gtable td.gpts { font-weight: 700; color: var(--gold); }
  tr.gh td { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
  tr.grow.q1 td.gpos { box-shadow: inset 3px 0 0 var(--accent); color: var(--accent); font-weight: 700; }
  tr.grow.q3 td.gpos { box-shadow: inset 3px 0 0 var(--gold); color: var(--gold); font-weight: 700; }
  .glegend { color: var(--muted); font-size: 11px; padding: 0 12px 10px; }
  .glegend .dot2 { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: middle; margin: 0 3px 0 8px; }
  .glegend .dot2.a { background: var(--accent); }
  .glegend .dot2.g { background: var(--gold); }
  /* knockout bracket */
  .bracket { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; }
  .bcol { display: flex; flex-direction: column; min-width: 82px; flex: 0 0 auto; }
  .bch { text-align: center; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px; white-space: nowrap; }
  .bcells { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 5px; }
  .bmatch { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 5px; }
  .bteam { display: flex; align-items: center; gap: 2px; font-size: 11px; line-height: 1.55; white-space: nowrap; }
  .bteam.win { color: var(--accent); font-weight: 700; }
  .bteam.tbd { color: var(--muted); }
  .bteam .babbr { overflow: hidden; text-overflow: ellipsis; }
  .bteam .bsc { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; padding-left: 4px; }
  .bronze-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 2px 2px 14px; }
  .bronze-line .bmatch { min-width: 82px; }
  .clinch { font-size: 11px; font-weight: 700; }
  .clinch.adv { color: var(--accent); }
  .day.clickable { cursor: pointer; display: flex; align-items: center; }
  .day .gchev { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
  .gmatches-wrap { max-height: 0; overflow: hidden; transition: max-height .28s ease; }
  .gmatches-wrap.open { max-height: 460px; }
  @media (prefers-reduced-motion: reduce) { .gmatches-wrap { transition: none; } }
  .gmatches { border-bottom: 1px solid var(--border); background: rgba(0,0,0,.12); }
  .gmatch { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid rgba(42,59,82,.4); font-size: 13px; }
  .gmatch:last-child { border-bottom: none; }
  .gmatch.islive { border-left: 3px solid var(--live); }
  .gm-teams { flex: 1; min-width: 0; font-weight: 600; }
  .gm-score { font-weight: 800; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  .gm-score.pre { color: var(--muted); font-weight: 400; }
  .gmatch.islive .gm-score { color: var(--live); }
  .gm-stat { min-width: 72px; text-align: right; font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* matches + live standings side panel */
  .sideboard { display: none; }
  @media (min-width: 920px) {
    .mwrap { display: grid; grid-template-columns: 1fr 290px; gap: 14px; align-items: start; }
    .sideboard { display: block; position: sticky; top: 66px; }
    .sideboard h4 { margin: 0; padding: 10px 12px; font-size: 13px; color: var(--gold); border-bottom: 1px solid var(--border); background: var(--panel2); }
    table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.mini td { padding: 4px 10px; border-bottom: 1px solid rgba(42,59,82,.45); }
    table.mini tr:last-child td { border-bottom: none; }
    table.mini td.r { color: var(--muted); width: 26px; }
    table.mini td.t { text-align: right; font-weight: 700; color: var(--gold); }
    .mv { font-size: 11px; margin-left: 5px; font-weight: 700; }
    .mv.up { color: var(--accent); }
    .mv.dn { color: var(--live); }
  }
  @media (max-width: 600px) {
    .wrap { padding: 8px 6px 50px; }
    table.board th, table.board td { padding: 8px 6px; }
    .match.open .picks { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo-300.png" alt="" class="logo" onclick="setTab('groups')" title="Lohkojen tilanne">
    <h1>MM-Mundo 2026</h1>
    <div class="prizes" id="prizes"></div>
    <div class="updated" id="updated"><span class="dot"></span>Ladataan tuloksia…</div>
  </header>

  <nav>
    <button id="tab-board" class="active" onclick="setTab('board')">Tilanne</button>
    <button id="tab-matches" onclick="setTab('matches')">Ottelut</button>
    <button id="tab-specials" onclick="setTab('specials')">Muut vedot</button>
    <button id="tab-groups" onclick="setTab('groups')">Turnaus</button>
  </nav>

  <div id="view-board"></div>
  <div id="view-matches" style="display:none"></div>
  <div id="view-specials" style="display:none"></div>
  <div id="view-groups" style="display:none"></div>

  <footer>
    Pisteet lasketaan automaattisesti live-tuloksista (ESPN). Käynnissä olevien otteluiden pisteet ovat alustavia.
  </footer>
</div>

<div id="playerModal" class="modal" onclick="if(event.target===this)closePlayer()">
  <div class="modal-card">
    <div class="modal-head">
      <div id="playerModalHead"></div>
      <button class="modal-close" onclick="closePlayer()" aria-label="Sulje">✕</button>
    </div>
    <div class="modal-body" id="playerModalBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
"use strict";

/* ====== Manual overrides — edit if the API gets something wrong ====== */
const OVERRIDES = {

function medalPoints(team) {
  if (["Brazil","Argentina","France","England","Spain","Portugal"].includes(team)) return 10;
  if (team === "Germany") return 15;
  if (team === "Netherlands" || team === "Belgium") return 20;
  return 40;
}
function matchPoints(pick, res) {
  if (!pick || !res) return null;
  if (pick[0] === res[0] && pick[1] === res[1]) {
    const low = (res[0] === 1 && res[1] === 0) || (res[0] === 1 && res[1] === 1) || (res[0] === 0 && res[1] === 1);
    return low ? 4 : 5;
  }
  return Math.sign(pick[0] - pick[1]) === Math.sign(res[0] - res[1]) ? 2 : 0;
}

function deaccent(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const d = Array.from({length: a.length + 1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// does a picked player name match a scorer's full name?
function playerMatch(pick, scorerName) {
  const pt = deaccent(pick.toLowerCase()).split(/[\s.]+/).filter(t => t.length >= 3);
  const st = deaccent(scorerName.toLowerCase()).split(/[\s.]+/).filter(Boolean);
  if (!pt.length) return false;
  // the pick's most specific (longest) token must match some token of the scorer name
  const main = pt.reduce((a, b) => b.length >= a.length ? b : a);
  return st.some(t => t === main || (main.length >= 4 && lev(t, main) <= 1));
}

/* ====== Live data ====== */
const API = "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260610-20260720&limit=250";
const SUMMARY_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=";
const SHOOTOUTS = {};   // eventId -> full shootout (per team, each kick with didScore) from the summary endpoint
// fetch full shootout sequences (incl. misses) for finished penalty matches not yet cached
async function fetchShootouts() {
  const pending = KO_EVENTS.filter(e => e.status.type.state === "post"
    && (e.competitions[0].competitors || []).some(c => c.shootoutScore != null) && !SHOOTOUTS[e.id]);
  if (!pending.length) return false;
  let got = false;
  await Promise.all(pending.map(async e => {
    try {
      const r = await fetch(SUMMARY_API + e.id);
      if (!r.ok) return;
      const d = await r.json();
      if (Array.isArray(d.shootout) && d.shootout.length) { SHOOTOUTS[e.id] = d.shootout; got = true; }
    } catch (err) {}
  }));
  return got;
}
let EVENTS = [];          // raw ESPN events
let EV_BY_PAIR = {};      // "TeamA|TeamB" sorted -> event info
let KO_EVENTS = [];       // knockout events sorted by date
let GOALS = {};           // athlete display name -> goal count (whole tournament)
let PLAYER_TEAM = {};     // athlete display name -> country (team displayName)
let lastFetchOk = null;
let expanded = new Set();
let activeTab = "board";

function pairKey(a, b) { return [a, b].sort().join("|"); }

const GROUP_PAIRS = new Set(POOL_DATA.matches.map(m => pairKey(m.home, m.away)));

function parseEvents(events) {
  EVENTS = events;
  EV_BY_PAIR = {};
  GOALS = {};
  PLAYER_TEAM = {};
  const groupIds = new Set();
  // earliest first, so a group game claims its pair before any later knockout rematch of it
  for (const e of [...events].sort((a, b) => a.date.localeCompare(b.date))) {
    const c = e.competitions[0];
    const comps = c.competitors || [];
    const home = comps.find(x => x.homeAway === "home");
    const away = comps.find(x => x.homeAway === "away");
    if (!home || !away) continue;
    const info = {
      id: e.id, date: e.date,
      state: e.status.type.state,              // pre | in | post
      detail: e.status.type.shortDetail,
      clock: e.status.type.name === "STATUS_HALFTIME" ? "HT" : e.status.displayClock,
      completed: e.status.type.completed,
      homeName: home.team.displayName, awayName: away.team.displayName,
      homeScore: parseInt(home.score || "0", 10), awayScore: parseInt(away.score || "0", 10),
      winner: comps.find(x => x.winner)?.team.displayName || null,
      goals: extractGoals(c),
    };
    for (const d of (c.details || [])) {   // top-scorer tally excludes own goals
      if (d.scoringPlay && !d.ownGoal && !d.shootout)
        for (const a of (d.athletesInvolved || []).slice(0, 1)) GOALS[a.displayName] = (GOALS[a.displayName] || 0) + 1;
    }
    const teamById = {};   // map every athlete that appears (goals, cards, …) to their own country
    for (const comp of comps) teamById[comp.team.id] = comp.team.displayName;
    for (const d of (c.details || [])) for (const a of (d.athletesInvolved || [])) {
      const tn = a.team && teamById[a.team.id];
      if (a.displayName && tn && !(a.displayName in PLAYER_TEAM)) PLAYER_TEAM[a.displayName] = tn;
    }
    if (REAL_TEAMS.has(info.homeName) && REAL_TEAMS.has(info.awayName)) {
      const key = pairKey(info.homeName, info.awayName);
      // only a real group-stage pairing counts as a group match; knockout ties stay in KO_EVENTS
      if (GROUP_PAIRS.has(key) && !(key in EV_BY_PAIR)) { EV_BY_PAIR[key] = info; groupIds.add(e.id); }
    }
  }
  // group matches claimed their events by pair key; everything else is knockout, chronological
  KO_EVENTS = events
    .filter(e => !groupIds.has(e.id))
    .sort((a, b) => a.date.localeCompare(b.date));
}

function koRoundName(idx, total, e) {
  // chronological: 16×R32, 8×R16, 4×QF, 2×SF, bronze, final
  const name = e.name || "";
  if (/Loser/.test(name)) return "bronze";
  if (idx === total - 1) return "final";
  if (idx < 16) return "r32";
  if (idx < 24) return "r16";
  if (idx < 28) return "qf";
  if (idx < 30) return "sf";
  return idx === total - 2 ? "bronze" : "final";
}
const ROUND_FI = { r32: "32 parasta", r16: "16 parasta", qf: "Puolivälierät", sf: "Välierät", bronze: "Pronssiottelu", final: "Loppuottelu" };

// FIFA R32 bracket (match 73–88 = "Round of 32 1–16"): each group winner/runner-up slot → match N.
// Lets us show the two possible teams behind a "Round of 32 N Winner" placeholder in the R16.
const SLOT_TO_N = {
  "2A": 1, "2B": 1, "1E": 2, "1F": 3, "2C": 3, "1C": 4, "2F": 4, "1I": 5, "2E": 6, "2I": 6,
  "1A": 7, "1L": 8, "1D": 9, "1G": 10, "2K": 11, "2L": 11, "1H": 12, "2J": 12, "1B": 13,
  "1J": 14, "2H": 14, "1K": 15, "2D": 16, "2G": 16,
};
function teamSlot(team) {   // "1A"/"2B" from final group position, or null for 3rd/4th
  if (!GROUPS) return null;
  for (const s of GROUPS.standings) {
    const i = s.rows.findIndex(r => r.team === team);
    if (i >= 0) return i < 2 ? `${i + 1}${s.group}` : null;
  }
  return null;
}
let R32_BY_N = {};   // R32 match number → the actual ESPN event (with its two teams)
function buildR32ByN() {
  const map = {};
  for (const ev of (koInfo().r32 || []))
    for (const c of ev.competitions[0].competitors) {
      const n = SLOT_TO_N[teamSlot(c.team.displayName)];
      if (n) { map[n] = ev; break; }
    }
  return map;
}

// resolve a knockout slot to a real team: ESPN-assigned, or a group winner we've already
// proven clinched. Returns the canonical team name, or null if still undetermined.
function koResolveTeam(displayName) {
  if (REAL_TEAMS.has(displayName)) return displayName;
  const cw = (GROUPS && GROUPS.clinchedWinner) || {};
  const m = (displayName || "").match(/^Group ([A-L]) Winner$/);
  if (m && cw[m[1]]) return cw[m[1]];
  return null;
}

// participants who have a given team in their special bets, with which bets
// bets still in play at a given round — earlier ones are already settled once that round is reached
function teamSpecialBackers(team, round) {
  const s = POOL_DATA.specials, out = [];
  const show8 = round === "r32" || round === "r16";           // top 8 settled once QF is reached
  const show4 = show8 || round === "qf";                       // top 4 settled once SF is reached
  for (const p of POOL_DATA.participants) {
    const bets = [];
    if (show8 && (s.top8[p] || []).includes(team)) bets.push("8 parasta");
    if (show4 && (s.top4[p] || []).includes(team)) bets.push("4 parasta");
    if (s.bronze[p] === team) bets.push("pronssi");
    if (s.finalLoser[p] === team) bets.push("hopea");
    if (s.champion[p] === team) bets.push("mestari");
    if (round === "sf" && s.semiScorer[p] && pickCountry(s.semiScorer[p]) === team) bets.push(`maali välierissä (${esc(s.semiScorer[p])})`);
    if (bets.length) out.push({ name: p, bets });
  }
  return out;
}

// turn an ESPN placeholder ("Group A Winner", "Round of 32 1 Winner") into a Finnish label,
// or render the real team with flag once it's settled
function koSideName(displayName) {
  const resolved = koResolveTeam(displayName);
  if (resolved) return `${flag(resolved)}${esc(fi(resolved))}`;
  const n = displayName || "";
  let m;
  if (m = n.match(/^Group ([A-L]) Winner$/)) return `<span class="ko-tbd">Lohkon ${m[1]} voittaja</span>`;
  if (m = n.match(/^Group ([A-L]) 2nd Place$/)) return `<span class="ko-tbd">Lohkon ${m[1]} kakkonen</span>`;
  if (m = n.match(/^Third Place Group ([A-Z/]+)$/)) return `<span class="ko-tbd">3. sija (${m[1]})</span>`;
  if (m = n.match(/^Round of 32 (\d+) Winner$/)) {
    const ev = R32_BY_N[+m[1]];
    const teams = ev ? ev.competitions[0].competitors.map(c => c.team.displayName).filter(t => REAL_TEAMS.has(t)) : [];
    if (teams.length === 2) return `<span class="ko-poss">${flag(teams[0])}${esc(fi(teams[0]))} <span class="koslash">/</span> ${flag(teams[1])}${esc(fi(teams[1]))}</span>`;
    return `<span class="ko-tbd">32 par. ottelu ${m[1]}</span>`;
  }
  if (m = n.match(/^Round of 16 (\d+) Winner$/)) return `<span class="ko-tbd">16 par. ottelu ${m[1]}</span>`;
  if (m = n.match(/^Quarterfinal (\d+) Winner$/)) return `<span class="ko-tbd">Puolivälierä ${m[1]}</span>`;
  if (m = n.match(/^Semifinal (\d+) Winner$/)) return `<span class="ko-tbd">Välierä ${m[1]} voittaja</span>`;
  if (m = n.match(/^Semifinal (\d+) Loser$/)) return `<span class="ko-tbd">Välierä ${m[1]} häviäjä</span>`;
  return `<span class="ko-tbd">${esc(n)}</span>`;
}

// knockout schedule for the Ottelut list. mode: 'upcoming' (live+tulevat) | 'done' | 'all'.
// 'done' lists newest round first so the latest results sit on top.
function renderPlayoffSchedule(mode) {
  if (!KO_EVENTS.length) return "";
  const ko = koInfo();
  const keep = e => mode === "all" ? true : mode === "done" ? e.status.type.state === "post" : e.status.type.state !== "post";
  let order = ["r32", "r16", "qf", "sf", "bronze", "final"];
  if (mode === "done") order = order.slice().reverse();
  let h = "";
  for (const r of order) {
    let evs = (ko[r] || []).filter(keep).slice().sort((a, b) => a.date.localeCompare(b.date));
    if (mode === "done") evs.reverse();
    if (!evs.length) continue;
    const anyLive = evs.some(e => e.status.type.state === "in");
    h += `<div class="panel ko"><div class="day">${ROUND_FI[r]}${anyLive ? ` <span class="badge-live"><span class="livedot">●</span> LIVE</span>` : ""}</div>`;
    for (const e of evs) {
      const c = e.competitions[0];
      const home = c.competitors.find(x => x.homeAway === "home"), away = c.competitors.find(x => x.homeAway === "away");
      const st = e.status.type, live = st.state === "in", when = new Date(e.date);
      const score = st.state === "pre" ? "" : `${home.score}–${away.score}`;
      const so = st.state === "post" ? extractShootout(c, e.id) : null;
      const status = live ? `<span class="badge-live"><span class="livedot">●</span> ${esc(st.name === "STATUS_HALFTIME" ? "HT" : (e.status.displayClock || "LIVE"))}</span>` : (st.state === "post" ? esc(st.shortDetail || "FT") : "");
      const homeT = koResolveTeam(home.team.displayName), awayT = koResolveTeam(away.team.displayName);
      const clickable = homeT || awayT;   // can show backers once at least one side is known
      const open = expandedKo.has(e.id) ? " open" : "";
      const koName = comp => (so && so.winner === comp.team.displayName) ? `<b>${koSideName(comp.team.displayName)}</b>` : koSideName(comp.team.displayName);
      h += `<div class="match ko${live ? " islive" : ""}${clickable ? " clickable" : ""}${open}"${clickable ? ` data-ko="${esc(e.id)}"` : ""}>
        <div class="mrow"${clickable ? ` onclick="toggleKo('${esc(e.id)}')"` : ""}>
        <div class="mtime">${DAY_FMT.format(when)}<br>${TIME_FMT.format(when)}</div>
        <div class="mteams">${koName(home)} – ${koName(away)}${st.state !== "post" ? koTvBadge(e) : ""}${clickable ? ` <span class="koexp">›</span>` : ""}</div>
        <div class="mscore${score ? "" : " pre"}">${score || "–"}${so ? `<span class="pen">rp ${so.hs}–${so.as}</span>` : ""}</div>
        <div class="mstatus">${status}</div>
        </div>${clickable ? `<div class="kopicks">${st.state !== "pre" ? goalsHtml(extractGoals(c)) + shootoutHtml(so) : ""}${renderKoBackers(home.team.displayName, away.team.displayName, homeT, awayT, r)}</div>` : ""}
      </div>`;
    }
    h += `</div>`;
  }
  return h ? `<h3 class="sec" style="margin-top:22px">🏆 Pudotuspelit</h3>${h}` : "";
}

const expandedKo = new Set();
function toggleKo(id) {
  if (expandedKo.has(id)) expandedKo.delete(id); else expandedKo.add(id);
  document.querySelector(`.match.ko[data-ko="${id}"]`)?.classList.toggle("open");
}

// penalty shootout: result + per-team kicks. Uses the detailed summary (incl. misses) once cached,
// otherwise the scoreboard details (scored kicks only).
function extractShootout(c, eventId) {
  const comps = c.competitors || [];
  const home = comps.find(x => x.homeAway === "home"), away = comps.find(x => x.homeAway === "away");
  if (!home || !away || (home.shootoutScore == null && away.shootoutScore == null)) return null;
  const result = { hs: +home.shootoutScore, as: +away.shootoutScore, winner: (comps.find(x => x.winner) || {}).team?.displayName || null, teams: [] };
  const detail = SHOOTOUTS[eventId];
  if (detail) {
    result.teams = detail.map(g => ({ team: g.team, shots: (g.shots || []).slice().sort((a, b) => a.shotNumber - b.shotNumber).map(s => ({ name: s.player, scored: s.didScore })) }));
  } else {
    const byId = {}, groups = {}, order = [];
    comps.forEach(x => byId[x.team.id] = x.team.displayName);
    for (const d of (c.details || [])) if (d.shootout) {
      const team = byId[d.team && d.team.id], a = (d.athletesInvolved || [])[0];
      if (!(team in groups)) { groups[team] = []; order.push(team); }
      groups[team].push({ name: a ? a.displayName : "", scored: !!d.scoringPlay });
    }
    result.teams = order.map(t => ({ team: t, shots: groups[t] }));
  }
  return result;
}
function shootoutHtml(so) {
  if (!so) return "";
  const lines = so.teams.map(g => g.shots.length
    ? `<div class="gline">${flag(g.team)}${g.shots.map(s => `${esc(s.name)} ${s.scored ? "✓" : '<span class="pmiss">✗</span>'}`).join(", ")}</div>` : "").filter(Boolean).join("");
  return `<div class="scorers"><div class="solabel">Rangaistuspotkukilpailu ${so.hs}–${so.as}${so.winner ? ` · ${flag(so.winner)}${esc(fi(so.winner))} jatkoon` : ""}</div>${lines}</div>`;
}

function koInfo() {
  const out = { r32: [], r16: [], qf: [], sf: [], bronze: [], final: [] };
  KO_EVENTS.forEach((e, i) => {
    const round = koRoundName(i, KO_EVENTS.length, e);
    out[round].push(e);
  });
  return out;
}
function realTeamsOf(events) {
  const s = new Set();
  for (const e of events)
    for (const c of e.competitions[0].competitors || [])
      if (REAL_TEAMS.has(c.team.displayName)) s.add(c.team.displayName);
  return s;
}

/* ====== Per-match result resolution ====== */
function resolveMatch(m) {
  if (OVERRIDES.results[m.row]) return { score: OVERRIDES.results[m.row], state: "post", detail: "FT*", live: false };
  const ev = EV_BY_PAIR[pairKey(m.home, m.away)];
  if (ev && ev.state !== "pre") {
    const swapped = ev.homeName !== m.home;
    const score = swapped ? [ev.awayScore, ev.homeScore] : [ev.homeScore, ev.awayScore];
    return { score, state: ev.state, detail: ev.detail, clock: ev.clock, live: ev.state === "in", date: ev.date, goals: ev.goals || [] };
  }
  if (m.sheetResult) return { score: m.sheetResult, state: "post", detail: "FT", live: false };
  return { score: null, state: "pre", detail: ev ? ev.detail : "", live: false, date: ev ? ev.date : null };
}

// goals from an ESPN competition: { name, minute, team(displayName), pen, og } in scoring order
function extractGoals(c) {
  const byId = {};
  for (const comp of (c.competitors || [])) byId[comp.team.id] = comp.team.displayName;
  const goals = [];
  for (const d of (c.details || [])) {
    if (!d.scoringPlay || d.shootout) continue;
    const a = (d.athletesInvolved || [])[0];
    goals.push({
      name: a ? a.displayName : "—",
      minute: (d.clock && d.clock.displayValue) || "",
      team: byId[d.team && d.team.id] || "",
      pen: !!d.penaltyKick, og: !!d.ownGoal,
    });
  }
  return goals;
}
// match-style scorer block: each scoring team on its own line, "Player 9', Player 67' (pen)"
function goalsHtml(goals) {
  if (!goals || !goals.length) return "";
  const order = [], byTeam = {};
  for (const g of goals) { if (!(g.team in byTeam)) { byTeam[g.team] = []; order.push(g.team); } byTeam[g.team].push(g); }
  const lines = order.map(team => {
    const players = [], byPlayer = {};
    for (const g of byTeam[team]) { if (!(g.name in byPlayer)) { byPlayer[g.name] = []; players.push(g.name); } byPlayer[g.name].push(g); }
    const items = players.map(name => {
      const mins = byPlayer[name].map(g => `${esc(g.minute)}${g.pen ? " (rp)" : ""}${g.og ? " (om)" : ""}`).join(", ");
      return `${esc(name)}${mins ? " " + mins : ""}`;
    }).join(", ");
    return `<div class="gline">${flag(team) || "⚽ "}${items}</div>`;
  });
  return `<div class="scorers">${lines.join("")}</div>`;
}

/* ====== Specials evaluation ====== */
function evalSpecials() {
  const ko = koInfo();
  const qfTeams = realTeamsOf(ko.qf);   // confirmed quarterfinalists so far
  const sfTeams = realTeamsOf(ko.sf);
  const bronzeEv = ko.bronze[0], finalEv = ko.final[0];
  const bronzeDone = bronzeEv && bronzeEv.status.type.completed;
  const finalDone = finalEv && finalEv.status.type.completed;
  const bronzeWinner = bronzeDone ? winnerOf(bronzeEv) : null;
  const champion = finalDone ? winnerOf(finalEv) : null;
  const finalLoser = finalDone ? loserOf(finalEv) : null;

  // semifinal scorers (goals are permanent as soon as scored)
  let semiScorers = OVERRIDES.semiScorers;
  if (!semiScorers) {
    semiScorers = [];
    for (const e of ko.sf) {
      const c = e.competitions[0];
      for (const d of (c.details || []))
        if (d.scoringPlay && !d.ownGoal && !d.shootout)
          for (const a of (d.athletesInvolved || []).slice(0, 1)) semiScorers.push(a.displayName);
    }
  }
  // top scorers — only final after the tournament; show current leaders meanwhile
  const maxGoals = Math.max(0, ...Object.values(GOALS));
  const leaders = Object.keys(GOALS).filter(n => GOALS[n] === maxGoals && maxGoals > 0);
  const topScorers = OVERRIDES.topScorers || (finalDone ? leaders : null);

  const per = {};
  for (const p of POOL_DATA.participants) {
    const s = POOL_DATA.specials;
    let pts = 0;
    const detail = {};
    // top 8 & top 4: 10p per correct team + 10p bonus if not BIG9
    detail.top8 = (s.top8[p] || []).map(t => {
      const hit = qfTeams.has(t);
      const got = hit ? 10 + (BIG9.has(t) ? 0 : 10) : 0;
      pts += got;
      return { team: t, hit, got };
    });
    detail.top4 = (s.top4[p] || []).map(t => {
      const hit = sfTeams.has(t);
      const got = hit ? 10 + (BIG9.has(t) ? 0 : 10) : 0;
      pts += got;
      return { team: t, hit, got };
    });
    // scores in semifinal
    const ssPick = s.semiScorer[p];
    const ssHit = !!(ssPick && semiScorers.some(n => playerMatch(ssPick, n)));
    detail.semiScorer = { pick: ssPick, hit: ssHit, got: ssHit ? 10 : 0 };
    pts += detail.semiScorer.got;
    // top scorer (decided at end)
    const tsPick = s.topScorer[p];
    const tsHit = !!(tsPick && topScorers && topScorers.some(n => playerMatch(tsPick, n)));
    const tsLeading = !!(tsPick && !topScorers && leaders.some(n => playerMatch(tsPick, n)));
    detail.topScorer = { pick: tsPick, hit: tsHit, leading: tsLeading, got: tsHit ? 10 : 0 };
    pts += detail.topScorer.got;
    // medal picks
    detail.bronze = medalPick(s.bronze[p], bronzeWinner); pts += detail.bronze.got;
    detail.finalLoser = medalPick(s.finalLoser[p], finalLoser); pts += detail.finalLoser.got;
    detail.champion = medalPick(s.champion[p], champion); pts += detail.champion.got;
    per[p] = { pts, detail };
  }
  return { per, qfTeams, sfTeams, semiScorers, topScorers, leaders, maxGoals, bronzeWinner, champion, finalLoser };
}
function medalPick(pick, actual) {
  if (!pick) return { pick: null, hit: false, got: 0, potential: 0 };
  const hit = actual === pick;
  return { pick, hit, decided: actual !== null, got: hit ? medalPoints(pick) : 0, potential: medalPoints(pick) };
}
function winnerOf(e) { return e.competitions[0].competitors.find(c => c.winner)?.team.displayName || null; }
function loserOf(e) { return e.competitions[0].competitors.find(c => !c.winner)?.team.displayName || null; }

/* ====== Streaks ====== */
// trailing run over finished matches: 3+ scoring matches in a row = hot, 3+ misses = cold
function computeStreaks() {
  const seq = POOL_DATA.matches
    .map(m => ({ m, r: resolveMatch(m) }))
    .filter(x => x.r.score && !x.r.live && x.r.state === "post")
    .sort((a, b) => (a.r.date || a.m.kickoff).localeCompare(b.r.date || b.m.kickoff));
  const out = {};
  POOL_DATA.participants.forEach((p, i) => {
    let n = 0, hot = null;
    for (let k = seq.length - 1; k >= 0; k--) {
      const pts = matchPoints(seq[k].m.picks[i], seq[k].r.score);
      if (pts == null) break;
      const hit = pts > 0;
      if (hot === null) { hot = hit; n = 1; }
      else if (hit === hot) n++;
      else break;
    }
    out[p] = n >= 3 ? { hot, n } : null;
  });
  return out;
}
function streakBadge(s) {
  if (!s) return "";
  const tip = s.hot ? `${s.n} osumaa putkeen` : `${s.n} ohilaukausta putkeen`;
  return `<span class="streak ${s.hot ? "hot" : "cold"}" title="${tip}">${s.hot ? "🔥" : "🧊"}${s.n}</span>`;
}

/* ====== Totals ====== */
function computeTotals() {
  const sp = evalSpecials();
  const streaks = computeStreaks();
  const rows = POOL_DATA.participants.map((p, i) => {
    let confirmed = 0, live = 0;
    for (const m of POOL_DATA.matches) {
      const r = resolveMatch(m);
      if (!r.score) continue;
      const pts = matchPoints(m.picks[i], r.score);
      if (pts == null) continue;
      if (r.live) live += pts; else confirmed += pts;
    }
    return { name: p, matchPts: confirmed, livePts: live, specPts: sp.per[p].pts, total: confirmed + sp.per[p].pts, streak: streaks[p] };
  });
  rows.sort((a, b) => (b.total + b.livePts) - (a.total + a.livePts) || a.name.localeCompare(b.name, "fi"));
  // shared ranks
  let lastScore = null, lastRank = 0;
  rows.forEach((r, idx) => {
    const s = r.total + r.livePts;
    if (s !== lastScore) { lastRank = idx + 1; lastScore = s; }
    r.rank = lastRank;
  });
  return { rows, sp };
}

const TIME_FMT = new Intl.DateTimeFormat("fi-FI", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Helsinki" });

function renderMatches(boardRows) {
  const all = POOL_DATA.matches.map(m => {

    return { m, r, when, day: DAY_FMT.format(when) };
  });
  const counts = {
    upcoming: all.filter(x => x.r.state !== "post").length,
    done: all.filter(x => x.r.state === "post").length,
    all: all.length,
    live: all.filter(x => x.r.live).length,
  };

  let items = matchFilter === "upcoming" ? all.filter(x => x.r.state !== "post")
            : matchFilter === "done" ? all.filter(x => x.r.state === "post")
            : all.slice();
  const reverse = matchFilter === "done";   // newest finished first
  items.sort((a, b) => reverse ? b.when - a.when : a.when - b.when);

  const byDay = new Map();
  for (const it of items) {
    if (!byDay.has(it.day)) byDay.set(it.day, []);

      <td><span class="chip ${ts.hit ? "hit" : ""}">${tsC ? flagTitled(tsC) : ""}${esc(ts.pick || "—")}${tsOut ? ` <span class="outtag" title="Joukkue pudonnut – maalisaldo jäissä">✕</span>` : ""}</span>${ts.leading ? ` <span class="note">johdossa 👀</span>` : ""}</td>

    // nearest chasers: 1–2 goals behind the leader

    h += `<tr><td><b>${esc(p)}</b></td>

      });
      h += `<div class="panel ko"><div class="roundname">${ROUND_FI[r]}</div>`;
      for (const e of playable.sort((a, b) => a.date.localeCompare(b.date))) {

        const st = e.status.type;

        h += `<div class="match"><div class="mrow">

      }

    }
  }
  $("view-specials").innerHTML = h;
}

let LAST = null;        // { rows, sp } from the most recent compute, for the player modal
let GROUPS = null;      // { standings, clinchedWinner } shared by Lohkot + playoff schedule
let ELIM = new Set();   // teams eliminated from the tournament

// teams out of the tournament: 4th in finalized groups, the 4 worst thirds (once all groups done),
// and losers of completed knockout matches
function eliminatedTeams() {
  const out = new Set();
  if (!GROUPS) return out;
  const finalized = GROUPS.standings.filter(s => s.finalized);
  for (const s of finalized) if (s.rows[3]) out.add(s.rows[3].team);   // 4th place
  if (finalized.length === 12) {
    const thirds = finalized.map(s => ({ team: s.rows[2].team, Pts: s.rows[2].Pts, GD: s.rows[2].GF - s.rows[2].GA, GF: s.rows[2].GF }));
    thirds.sort((a, b) => b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF || a.team.localeCompare(b.team));
    thirds.slice(8).forEach(t => out.add(t.team));   // ranks 9–12 of the thirds miss out
  }
  for (const e of KO_EVENTS) {
    if (e.status.type.state !== "post") continue;
    for (const comp of (e.competitions[0].competitors || []))
      if (!comp.winner && REAL_TEAMS.has(comp.team.displayName)) out.add(comp.team.displayName);
  }
  return out;
}
function outMark(team) { return ELIM.has(team) ? ` <span class="outtag" title="Pudonnut jatkosta">✕</span>` : ""; }
// resolve a free-text scorer pick to a country via players seen in events. Exact surname match
// first; fall back to a fuzzy match (tolerating typos like "Mbabbe"→"Mbappé") only if there's no
// exact hit. Resolves only when the match points to a single country (avoids false positives).
// manual fallback for picked players not (yet) resolvable from match events (no goal/card data)
const SCORER_COUNTRY = { modric: "Croatia", olise: "France", doue: "France" };
function pickCountry(name) {
  if (!name) return null;
  const tokens = deaccent(name.toLowerCase()).split(/[\s.]+/).filter(t => t.length >= 4);
  if (!tokens.length) return null;
  const surname = tokens[tokens.length - 1];
  if (SCORER_COUNTRY[surname]) return SCORER_COUNTRY[surname];
  const players = Object.keys(PLAYER_TEAM).map(p => ({ team: PLAYER_TEAM[p], toks: deaccent(p.toLowerCase()).split(/[\s.]+/) }));
  const collect = test => { const s = new Set(); for (const p of players) if (p.toks.some(test)) s.add(p.team); return s; };
  let hits = collect(t => t === surname);                       // exact
  if (!hits.size) {                                             // fuzzy fallback for typos
    const tol = surname.length >= 5 ? 2 : 1;
    hits = collect(t => t.length === surname.length && lev(t, surname) <= tol);   // same length first
    if (!hits.size) hits = collect(t => t.length >= 4 && lev(t, surname) <= tol);
  }
  return hits.size === 1 ? [...hits][0] : null;
}

}

/* ====== World Cup group standings (computed live from results) ====== */
// points each team earns in matches played only among `set` (FIFA step-one criterion 1)
function headToHeadPoints(set, games, outcome) {
  const s = new Set(set), p = {};
  set.forEach(t => p[t] = 0);
  games.forEach((g, i) => {
    if (!s.has(g.h) || !s.has(g.a)) return;
    const o = outcome[i];
    if (o === 0) p[g.h] += 3; else if (o === 1) { p[g.h]++; p[g.a]++; } else p[g.a] += 3;
  });
  return p;
}
// Sound clinch check: brute-force every outcome of the group's undecided games (live games count
// as undecided). Ties on points are broken by head-to-head points (FIFA step one); any tie that
// head-to-head can't resolve is counted against the team, so we only claim a mathematically
// certain clinch. `games`: [{h,a,fixed}] where fixed is 0|1|2 for played games, null otherwise.
function groupClinches(teams, games) {
  const variable = games.map((g, i) => g.fixed === null ? i : -1).filter(i => i >= 0);
  const clinch1st = new Set(teams), clinchTop2 = new Set(teams);
  const total = 3 ** variable.length;
  for (let mask = 0; mask < total; mask++) {
    const outcome = games.map(g => g.fixed);
    let mm = mask;
    for (const i of variable) { outcome[i] = mm % 3; mm = (mm - outcome[i]) / 3; }
    const pts = {};
    teams.forEach(t => pts[t] = 0);
    games.forEach((g, i) => { const o = outcome[i]; if (o === 0) pts[g.h] += 3; else if (o === 1) { pts[g.h]++; pts[g.a]++; } else pts[g.a] += 3; });
    for (const t of teams) {
      let above = 0;
      const tied = teams.filter(u => pts[u] === pts[t]);
      const h2h = tied.length > 1 ? headToHeadPoints(tied, games, outcome) : null;
      for (const u of teams) {
        if (u === t) continue;
        if (pts[u] > pts[t]) above++;
        else if (pts[u] === pts[t] && h2h[u] >= h2h[t]) above++;   // tie unresolved by H2H → against t
      }
      if (above >= 1) clinch1st.delete(t);
      if (above >= 2) clinchTop2.delete(t);
    }
    if (!clinch1st.size && !clinchTop2.size) break;
  }
  return { clinch1st, clinchTop2 };
}

// mini-table (points/GD/goals) among `set`, using played games only — FIFA step one
function h2hTable(set, games) {
  const s = new Set(set), t = {};
  set.forEach(x => t[x] = { pts: 0, gd: 0, gf: 0 });
  for (const g of games) {
    if (g.hg == null || !s.has(g.h) || !s.has(g.a)) continue;
    t[g.h].gf += g.hg; t[g.h].gd += g.hg - g.ag;
    t[g.a].gf += g.ag; t[g.a].gd += g.ag - g.hg;
    if (g.hg > g.ag) t[g.h].pts += 3; else if (g.hg < g.ag) t[g.a].pts += 3; else { t[g.h].pts++; t[g.a].pts++; }
  }
  return t;
}
// rank a group's rows by full FIFA order: points → head-to-head (pts/GD/goals) → overall GD → goals
function rankGroup(rows, games) {
  return rows.slice().sort((A, B) => {
    if (B.Pts !== A.Pts) return B.Pts - A.Pts;
    const tied = rows.filter(r => r.Pts === A.Pts).map(r => r.team);
    if (tied.length > 1) {
      const h = h2hTable(tied, games);
      if (h[B.team].pts !== h[A.team].pts) return h[B.team].pts - h[A.team].pts;
      if (h[B.team].gd !== h[A.team].gd) return h[B.team].gd - h[A.team].gd;
      if (h[B.team].gf !== h[A.team].gf) return h[B.team].gf - h[A.team].gf;
    }
    return (B.GF - B.GA) - (A.GF - A.GA) || B.GF - A.GF || A.team.localeCompare(B.team, "fi");
  });
}

// third-placed teams are ranked across groups by points → GD → goals (no head-to-head)
function thirdAbove(X, Y) {
  if (X.Pts !== Y.Pts) return X.Pts > Y.Pts;
  if (X.GD !== Y.GD) return X.GD > Y.GD;
  if (X.GF !== Y.GF) return X.GF > Y.GF;
  return false;   // exactly level → can't guarantee order (disciplinary/lots)
}
// max points the eventual 3rd-placed team of an unfinished group could reach
function maxThirdPoints(G) {
  const teams = [...G.teams.keys()];
  const remaining = G.games.filter(g => g.fixed === null);
  let best = 0;
  const total = 3 ** remaining.length;
  for (let mask = 0; mask < total; mask++) {
    const pts = {}; teams.forEach(t => pts[t] = G.cPts[t]);
    let mm = mask;
    for (const g of remaining) { const o = mm % 3; mm = (mm - o) / 3; if (o === 0) pts[g.h] += 3; else if (o === 1) { pts[g.h]++; pts[g.a]++; } else pts[g.a] += 3; }
    const sorted = teams.map(t => pts[t]).sort((a, b) => b - a);
    if (sorted[2] > best) best = sorted[2];
  }
  return best;
}

function computeGroupStandings() {
  const groups = {};
  for (const m of POOL_DATA.matches) {
    const g = m.group;
    if (!groups[g]) groups[g] = { teams: new Map(), live: false, cPts: {}, games: [] };
    const G = groups[g];
    for (const t of [m.home, m.away])
      if (!G.teams.has(t)) { G.teams.set(t, { team: t, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, Pts: 0 }); G.cPts[t] = 0; }
    const r = resolveMatch(m);
    if (r.score) {   // standings table includes live (provisional) results
      const [hg, ag] = r.score;
      const H = G.teams.get(m.home), A = G.teams.get(m.away);
      H.P++; A.P++; H.GF += hg; H.GA += ag; A.GF += ag; A.GA += hg;
      if (hg > ag) { H.W++; H.Pts += 3; A.L++; }
      else if (hg < ag) { A.W++; A.Pts += 3; H.L++; }
      else { H.D++; A.D++; H.Pts++; A.Pts++; }
    }
    // clinch math only trusts finished games; pre/live are undecided (fixed:null)
    let fixed = null, hg = null, ag = null;
    if (r.state === "post") {
      [hg, ag] = r.score;
      fixed = hg > ag ? 0 : hg < ag ? 2 : 1;
      if (hg > ag) G.cPts[m.home] += 3; else if (hg < ag) G.cPts[m.away] += 3; else { G.cPts[m.home]++; G.cPts[m.away]++; }
    } else if (r.live) G.live = true;
    G.games.push({ h: m.home, a: m.away, fixed, hg, ag });
  }
  const clinchedWinner = {};
  const standings = Object.keys(groups).sort().map(g => {
    const G = groups[g];
    const rows = rankGroup([...G.teams.values()], G.games);   // FIFA-ordered standings
    const finalized = G.games.every(gm => gm.fixed !== null);
    if (finalized) {
      // group complete — finishing position is exact; no projection needed
      clinchedWinner[g] = rows[0].team;
      rows.forEach((row, i) => { row.clinchWin = i === 0; row.clinchAdv = i < 2 || G.cPts[row.team] >= 6; });
    } else {
      const { clinch1st, clinchTop2 } = groupClinches([...G.teams.keys()], G.games);
      clinchedWinner[g] = clinch1st.size === 1 ? [...clinch1st][0] : null;
      rows.forEach(row => {
        row.clinchWin = clinch1st.has(row.team);
        row.clinchAdv = clinchTop2.has(row.team) || G.cPts[row.team] >= 6;   // ≥6 secured pts ⇒ top-8 third at worst
      });
    }
    return { group: g, live: G.live, rows, finalized, G };
  });

  // cross-group: which finished 3rd-placed teams have clinched a best-8-thirds spot
  const finishedThirds = [], unfinishedMaxThird = [];
  for (const s of standings) {
    if (s.finalized) { const r = s.rows[2]; finishedThirds.push({ team: r.team, Pts: r.Pts, GD: r.GF - r.GA, GF: r.GF }); }
    else unfinishedMaxThird.push(maxThirdPoints(s.G));
  }
  for (const X of finishedThirds) {
    let threats = 0;
    for (const Y of finishedThirds) if (Y !== X && !thirdAbove(X, Y)) threats++;   // Y level-or-above X
    for (const m of unfinishedMaxThird) if (m >= X.Pts) threats++;                  // group could outscore X
    if (threats <= 7) {   // ≤7 others can rank above ⇒ X is among the best 8 thirds
      const row = standings.find(s => s.rows[2] && s.rows[2].team === X.team).rows[2];
      row.clinchAdv = true;
    }
  }
  standings.forEach(s => { delete s.G; });   // drop internal handle before returning
  return { standings, clinchedWinner };
}

/* ====== knockout bracket picture ====== */
const R16N_BY_R32 = { "2,5": 1, "1,3": 2, "4,6": 3, "7,8": 4, "11,12": 5, "9,10": 6, "14,16": 7, "13,15": 8 };
const QFN_BY_R16 = { "1,2": 1, "5,6": 2, "3,4": 3, "7,8": 4 };
const SFN_BY_QF = { "1,2": 1, "3,4": 2 };
function invPos(map) { const o = {}; for (const k in map) k.split(",").forEach(x => o[+x] = map[k]); return o; }
const R16B_BY_N32 = invPos(R16N_BY_R32), QFB_BY_R16 = invPos(QFN_BY_R16);

function renderBracket() {
  if (!KO_EVENTS.length || !Object.keys(R32_BY_N).length) return "";
  const ko = koInfo();
  const teamR32N = {}, teamR16B = {}, teamQFB = {}, abbr = {};
  for (let n = 1; n <= 16; n++) { const ev = R32_BY_N[n]; if (!ev) continue; for (const c of ev.competitions[0].competitors) if (REAL_TEAMS.has(c.team.displayName)) teamR32N[c.team.displayName] = n; }
  for (const t in teamR32N) { teamR16B[t] = R16B_BY_N32[teamR32N[t]]; teamQFB[t] = QFB_BY_R16[teamR16B[t]]; }
  for (const e of KO_EVENTS) for (const c of e.competitions[0].competitors) if (REAL_TEAMS.has(c.team.displayName)) abbr[c.team.displayName] = c.team.abbreviation;
  const sideR32N = nm => { const m = nm.match(/^Round of 32 (\d+) Winner$/); return m ? +m[1] : (teamR32N[nm] ?? null); };
  const sideR16B = nm => { const m = nm.match(/^Round of 16 (\d+) Winner$/); return m ? +m[1] : (teamR16B[nm] ?? null); };
  const sideQFB = nm => { const m = nm.match(/^Quarterfinal (\d+) Winner$/); return m ? +m[1] : (teamQFB[nm] ?? null); };
  const place = (events, sideFn, posMap) => { const arr = []; for (const e of events) { const c = e.competitions[0].competitors; const key = [sideFn(c[0].team.displayName), sideFn(c[1].team.displayName)].sort((a, b) => a - b).join(","); if (posMap[key]) arr[posMap[key] - 1] = e; } return arr; };
  const r32 = []; for (let n = 1; n <= 16; n++) r32[n - 1] = R32_BY_N[n];
  const r16 = place(ko.r16, sideR32N, R16N_BY_R32), qf = place(ko.qf, sideR16B, QFN_BY_R16), sf = place(ko.sf, sideQFB, SFN_BY_QF);

  function sideHtml(ev, idx) {
    if (!ev) return `<span class="bteam tbd">·</span>`;
    const c = ev.competitions[0].competitors[idx], nm = c.team.displayName, st = ev.status.type;
    if (REAL_TEAMS.has(nm)) return `<span class="bteam ${c.winner ? "win" : ""}">${flag(nm)}<span class="babbr">${esc(abbr[nm] || fi(nm))}</span><span class="bsc">${st.state !== "pre" ? esc(c.score) : ""}${c.shootoutScore != null ? `<span class="bpen">(${esc(c.shootoutScore)})</span>` : ""}</span></span>`;
    const m = nm.match(/^Round of 32 (\d+) Winner$/);
    if (m && R32_BY_N[+m[1]]) { const ts = R32_BY_N[+m[1]].competitions[0].competitors.map(x => x.team.displayName).filter(t => REAL_TEAMS.has(t)); if (ts.length === 2) return `<span class="bteam tbd">${flag(ts[0])}${flag(ts[1])}</span>`; }
    return `<span class="bteam tbd">·</span>`;
  }
  const matchBox = ev => `<div class="bmatch">${sideHtml(ev, 0)}${sideHtml(ev, 1)}</div>`;
  const col = (label, order, evs) => `<div class="bcol"><div class="bch">${label}</div><div class="bcells">${order.map(p => matchBox(evs[p - 1])).join("")}</div></div>`;

  let h = `<h3 class="sec">🏆 Kaavio <span class="note">(mahdolliset joukkueet / voittaja korostettuna)</span></h3><div class="bracket">`;
  h += col("32 parasta", [2, 5, 1, 3, 11, 12, 9, 10, 4, 6, 7, 8, 14, 16, 13, 15], r32);
  h += col("16 parasta", [1, 2, 5, 6, 3, 4, 7, 8], r16);
  h += col("8 parasta", [1, 2, 3, 4], qf);
  h += col("4 parasta", [1, 2], sf);
  h += `<div class="bcol"><div class="bch">Loppu</div><div class="bcells">${matchBox(ko.final[0])}</div></div>`;
  h += `</div>`;
  if (ko.bronze[0]) h += `<div class="bronze-line">🥉 Pronssiottelu: ${matchBox(ko.bronze[0])}</div>`;
  return h;
}

function renderGroups() {
  const { standings } = GROUPS || computeGroupStandings();
  let h = renderBracket();
  h += `<h3 class="sec">Lohkot</h3><div class="glegend"><span class="dot2 a"></span>2 parasta jatkoon · <span class="dot2 g"></span>3. sija (8 parasta kolmosta jatkoon) · <span class="clinch win">🏆</span> lohkovoitto varma · <span class="clinch adv">✓</span> jatkopaikka varma</div>`;
  for (const { group, rows, live } of standings) {
    const open = expandedGroups.has(group);
    h += `<div class="panel"><div class="day clickable" onclick="toggleGroup('${group}')">Lohko ${group}${live ? ` <span class="badge-live"><span class="livedot">●</span> LIVE</span>` : ""}<span class="gchev" data-gm="${group}">${open ?"▾ ottelut" : "▸ ottelut"}</span></div>`;
    h += `<div class="gmatches-wrap${open ? " open" : ""}" data-gm="${group}"><div class="gmatches-inner">${groupMatchesHtml(group)}</div></div>`;
    h += `<table class="gtable"><tr class="gh"><td class="gpos"></td><td class="gteam">Joukkue</td><td>O</td><td>V</td><td>T</td><td>H</td><td>Maalit</td><td class="gpts">P</td></tr>`;
    rows.forEach((r, i) => {
      const q = i < 2 ? " q1" : i === 2 ? " q3" : "";
      const badge = r.clinchWin ? ` <span class="clinch win" title="Lohkovoitto varmistettu">🏆</span>`
                  : r.clinchAdv ? ` <span class="clinch adv" title="Jatkopaikka varmistettu">✓</span>` : "";
      h += `<tr class="grow${q}"><td class="gpos">${i + 1}</td><td class="gteam">${flag(r.team)}${esc(fi(r.team))}${badge}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}–${r.GA}</td><td class="gpts">${r.Pts}</td></tr>`;
    });
    h += `</table></div>`;
  }
  $("view-groups").innerHTML = h;
}

const expandedGroups = new Set();
function toggleGroup(g) {
  const open = !expandedGroups.has(g);
  if (open) expandedGroups.add(g); else expandedGroups.delete(g);
  document.querySelector(`.gmatches-wrap[data-gm="${g}"]`)?.classList.toggle("open", open);
  const chev = document.querySelector(`.gchev[data-gm="${g}"]`);
  if (chev) chev.textContent = open ? "▾ ottelut" : "▸ ottelut";
}

// all matches of a group (chronological) shown above its standings
function groupMatchesHtml(group) {
  const items = POOL_DATA.matches.filter(m => m.group === group).map(m => {
    const r = resolveMatch(m);
    return { m, r, when: new Date(r.date || m.kickoff) };
  }).sort((a, b) => a.when - b.when);
  let h = `<div class="gmatches">`;
  for (const { m, r, when } of items) {
    const score = r.score ? `${r.score[0]}–${r.score[1]}` : "–";
    const status = r.live ? `<span class="badge-live"><span class="livedot">●</span> ${esc(r.clock || "LIVE")}</span>` : (r.state === "post" ? "FT" : `${DAY_FMT.format(when)} ${TIME_FMT.format(when)}`);
    h += `<div class="gmatch${r.live ? " islive" : ""}">
      <div class="gm-teams">${flag(m.home)}${esc(m.homeFi)} – ${flag(m.away)}${esc(m.awayFi)}</div>
      <div class="gm-score${r.score ? "" : " pre"}">${esc(score)}</div>
      <div class="gm-stat">${status}</div>
    </div>`;
  }
  return h + `</div>`;
}

/* ====== Player detail modal ====== */
let openPlayer = null;
function jsName(name) { return name.replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }
function showPlayer(name) { openPlayer = name; $("playerModal").style.display = "block"; $("playerModal").scrollTop = 0; renderPlayerModal(); }
function closePlayer() { openPlayer = null; $("playerModal").style.display = "none"; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && openPlayer) closePlayer(); });

function renderPlayerModal() {
  if (!openPlayer || !LAST) return;
  const name = openPlayer;
  const i = POOL_DATA.participants.indexOf(name);
  if (i < 0) return;
  const row = LAST.rows.find(r => r.name === name);
  const sp = LAST.sp;
  const live = n => n ? `<span class="livepts">+${n}</span>` : "";

  $("playerModalHead").innerHTML =
    `<div><h2>${esc(name)}${streakBadge(row.streak)}</h2>
     <div class="modal-sub">Sija ${row.rank}. · Ottelut ${row.matchPts}${live(row.livePts)} · Erikois ${row.specPts} · Yhteensä <b style="color:var(--gold)">${row.total}${live(row.livePts)}</b></div></div>`;

  // match picks, chronological with day separators
  const items = POOL_DATA.matches
    .map(m => { const r = resolveMatch(m); return { m, r, when: new Date(r.date || m.kickoff) }; })
    .sort((a, b) => a.when - b.when);
  let mt = `<table class="ptable"><tr class="pt-hdr"><td></td><td></td><td class="pt-pick">Veikkaus</td><td class="pt-res">Tulos</td><td class="pt-pts">P</td></tr>`;
  let lastDay = null;
  for (const { m, r, when } of items) {
    const day = DAY_FMT.format(when);
    if (day !== lastDay) { mt += `<tr class="pt-day"><td colspan="5">${esc(day)}</td></tr>`; lastDay = day; }
    const pick = m.picks[i];
    const pts = r.score ? matchPoints(pick, r.score) : null;
    const rcls = pts == null ? "" : ` r${pts}`;
    mt += `<tr class="prow${rcls}${r.live ? " live" : ""}">
      <td class="pt-time">${TIME_FMT.format(when)}</td>
      <td>${flag(m.home)}${esc(m.homeFi)} – ${flag(m.away)}${esc(m.awayFi)}</td>
      <td class="pt-pick">${pick ? pick[0] + "–" + pick[1] : "—"}</td>
      <td class="pt-res${r.score ? "" : " pre"}">${r.score ? r.score[0] + "–" + r.score[1] : "–"}${r.live ? ` <span class="badge-live"><span class="livedot">●</span></span>` : ""}</td>
      <td class="pt-pts">${pts == null ? "" : (pts ? "+" + pts : "0")}</td>
    </tr>`;
  }
  mt += `</table>`;

  // specials
  const det = sp.per[name].detail;
  const teamChip = (x, decided) => `<span class="chip ${x.hit ? "hit" + (x.got > 10 ? " bonus" : "") : (ELIM.has(x.team) ? "dead" : (decided ? "miss" : ""))}">${flag(x.team)}${esc(fi(x.team))}${x.hit ? " +" + x.got : outMark(x.team)}</span>`;
  const medalChip = (x, actual) => `<span class="chip ${x.hit ? "hit bonus" : (x.pick && ELIM.has(x.pick) ? "dead" : (actual ? "miss" : ""))}">${x.pick ? flag(x.pick) : ""}${esc(x.pick ? fi(x.pick) : "—")} (${x.potential || ""})${x.hit ? " +" + x.got : outMark(x.pick)}</span>`;
  const scorerChip = (x, extra = "") => { const c = pickCountry(x.pick), out = !x.hit && c && ELIM.has(c); return `<span class="chip ${x.hit ? "hit" : (out ? "dead" : "")}">${c ? flagTitled(c) : ""}${esc(x.pick || "—")}${x.hit ? " +" + x.got : (out ? ` <span class="outtag" title="Joukkue pudonnut">✕</span>` : "")}</span>${extra}`; };
  const specRow = (label, val) => `<div class="pspec"><div class="pspec-l">${label}</div><div class="pspec-v">${val}</div></div>`;

  let sps = `<h3 class="psec">Erikoisveikkaukset (${sp.per[name].pts} p)</h3>`;
  sps += specRow("8 parasta", det.top8.map(x => teamChip(x, sp.qfTeams.size >= 8)).join(""));
  sps += specRow("4 parasta", det.top4.map(x => teamChip(x, sp.sfTeams.size >= 4)).join(""));
  sps += specRow("Maali välierissä", scorerChip(det.semiScorer));
  sps += specRow("Maalikuningas", scorerChip(det.topScorer, det.topScorer.leading ? ` <span class="note" style="margin:0">johdossa 👀</span>` : ""));
  sps += specRow("Pronssi", medalChip(det.bronze, sp.bronzeWinner));
  sps += specRow("Hopea", medalChip(det.finalLoser, sp.finalLoser));
  sps += specRow("Mestari", medalChip(det.champion, sp.champion));

  // group-stage stats from this person's picks
  let finished = 0, correctP = 0, exactP = 0, nearP = 0;
  const freq = {};
  for (const m of POOL_DATA.matches) {
    const pick = m.picks[i];
    if (pick) { const k = pick[0] + "–" + pick[1]; freq[k] = (freq[k] || 0) + 1; }
    const r = resolveMatch(m);
    if (r.state !== "post" || !r.score || !pick) continue;
    finished++;
    const pts = matchPoints(pick, r.score);
    if (pts > 0) correctP++;
    if (pts >= 4) exactP++;
    if (Math.abs(pick[0] - r.score[0]) + Math.abs(pick[1] - r.score[1]) === 1) nearP++;   // off by one goal
  }
  let favScore = "—", favCount = 0;
  for (const [k, c] of Object.entries(freq)) if (c > favCount) { favCount = c; favScore = k; }
  const pct = finished ? Math.round(100 * correctP / finished) : 0;
  const statsHtml = `<h3 class="psec" style="margin-top:6px">Lohkovaiheen tilastot</h3>
    <div class="pstats">
      <div class="pstat" title="Oikea lopputulos (väh. 2 p)"><div class="pstat-n">${correctP}/${finished}</div><div class="pstat-l">Osumaa${finished ? ` · ${pct}%` : ""}</div></div>
      <div class="pstat" title="Täysin oikea tulos"><div class="pstat-n">${exactP}</div><div class="pstat-l">Täysosumaa</div></div>
      <div class="pstat" title="Yhden maalin päässä oikeasta tuloksesta"><div class="pstat-n">${nearP}</div><div class="pstat-l">Lähellä ±1</div></div>
      <div class="pstat" title="Useimmin veikkaamasi tulos"><div class="pstat-n">${esc(favScore)}</div><div class="pstat-l">Lempitulos${favCount > 1 ? ` ·&nbsp;${favCount}×` : ""}</div></div>
    </div>`;

  $("playerModalBody").innerHTML =
    statsHtml +
    `<h3 class="psec">Otteluveikkaukset</h3><div class="hint" style="padding:0 2px 8px">${SCORING_HTML}</div>${mt}${sps}`;
}

/* ====== Refresh loop ====== */
async function refresh() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    parseEvents(data.events || []);
    lastFetchOk = new Date();
    $("updated").className = "updated";
    $("updated").innerHTML = `<span class="dot"></span>Päivitetty ${TIME_FMT.format(lastFetchOk)}${anyLive() ? ' — <span class="badge-live"><span class="livedot">●</span> LIVE</span>' : ""}`;
  } catch (err) {
    $("updated").className = "updated err";
    $("updated").innerHTML = `<span class="dot"></span>Tulospäivitys epäonnistui${lastFetchOk ? " — näytetään klo " + TIME_FMT.format(lastFetchOk) + " tilanne" : ""}`;
  }
  renderAll();
  fetchShootouts().then(got => { if (got) renderAll(); });   // fill in penalty misses, then re-render
  scheduleNext();
}
function anyLive() { return EVENTS.some(e => e.status.type.state === "in"); }
let timer = null;
function scheduleNext() {
  clearTimeout(timer);
  timer = setTimeout(refresh, anyLive() ? 30000 : 120000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

$("prizes").textContent = POOL_DATA.prizes + " · " + POOL_DATA.participants.length + " osallistujaa";
renderAll();
try {   // restore the last viewed tab
  const saved = localStorage.getItem("mm_tab");
  if (saved && saved !== "board" && $("view-" + saved)) setTab(saved);
} catch (e) {}
refresh();
</script>
</body>
</html>
